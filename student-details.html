<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8"><!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تفاصيل الطالب</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 18px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .student-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            text-align: center;
        }

        .student-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .student-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .scores {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .score-box {
            min-width: 200px;
            padding: 20px;
            background: #f1f3f5;
            border-radius: 12px;
        }

        .score-title {
            font-size: 16px;
            color: #666;
            margin-bottom: 8px;
        }

        .score-value {
            font-size: 30px;
            font-weight: bold;
        }

        .exams-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .exam {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .exam-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .exam-image {
            width: 100%;
            text-align: center;
        }

        .exam-image img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .no-image {
            padding: 30px;
            background: #f5f5f5;
            color: #777;
            border-radius: 10px;
            text-align: center;
        }

        .not-found {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            font-size: 22px;
        }

        @media (max-width: 600px) {

            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .student-name {
                font-size: 23px;
            }

            .score-box {
                width: 100%;
            }

            .exam-title {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="index.html" class="back-btn">
            ← العودة للطلاب
        </a>

        <div id="studentDetails"></div>

    </div>

    <script src="students.js"></script>

    <script>

        // Get student ID from URL
        const params = new URLSearchParams(window.location.search);
        const studentId = Number(params.get("id"));

        // Find student
        const student = competitors.find(x => x.id === studentId);

        const container = document.getElementById("studentDetails");

        // Student not found
        if (!student) {

            container.innerHTML = `
                <div class="not-found">
                    <h2>الطالب غير موجود</h2>
                    <p>تأكد من صحة رابط الطالب.</p>
                </div>
            `;

        } else {

            // Student avatar
            const avatarHtml = student.avatar
                ? `<img class="student-avatar" src="${student.avatar}" alt="${student.name}">`
                : "";

            // Exams
            let examsHtml = "";

            if (!student.exams || student.exams.length === 0) {

                examsHtml = `
                    <div class="no-image">
                        لا توجد امتحانات لهذا الطالب.
                    </div>
                `;

            } else {

                examsHtml = student.exams.map(exam => {

                    let imageHtml = "";

                    if (exam.img) {

                        // Directly use the image path
                        imageHtml = `
                            <div class="exam-image">
                                <img
                                    src="${exam.img}"
                                    alt="${exam.title}"
                                >
                            </div>
                        `;

                    } else {

                        imageHtml = `
                            <div class="no-image">
                                لا توجد صورة لهذا الامتحان.
                            </div>
                        `;
                    }

                    return `
                        <div class="exam">

                            <div class="exam-title">
                                ${exam.title}
                            </div>

                            ${imageHtml}

                        </div>
                    `;

                }).join("");
            }

            // Render student page
            container.innerHTML = `

                <div class="student-card">

                    ${avatarHtml}

                    <div class="student-name">
                        ${student.name}
                    </div>

                    <div class="scores">

                        <div class="score-box">

                            <div class="score-title">
                                درجة الشهر
                            </div>

                            <div class="score-value">
                                ${student.monthlyPoints}
                            </div>

                        </div>

                        <div class="score-box">

                            <div class="score-title">
                                الدرجة الكلية
                            </div>

                            <div class="score-value">
                                ${student.overallPoints}
                            </div>

                        </div>

                    </div>

                </div>

                <div class="exams-title">
                    الامتحانات
                </div>

                ${examsHtml}
            `;
        }

    </script>

</body>

</html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تفاصيل الطالب</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            padding: 40px 20px;
        }


        .container {
            width: 100%;
            max-width: 800px;
            margin: auto;
        }


        /* Header */

        .page-header {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }


        .page-header h1 {
            color: #222;
            font-size: 28px;
            margin-bottom: 8px;
        }


        .page-header p {
            color: #777;
            font-size: 14px;
        }


        /* Student Card */

        .student-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }


        .student-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }


        .student-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e0e0e0;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
            font-weight: bold;
            color: #555;

            overflow: hidden;
            flex-shrink: 0;
        }


        .student-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        .student-name {
            flex: 1;
        }


        .student-name h2 {
            color: #222;
            font-size: 24px;
            margin-bottom: 5px;
        }


        .student-name p {
            color: #888;
            font-size: 14px;
        }


        /* Scores */

        .scores {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }


        .score-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #eee;
        }


        .score-card .label {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }


        .score-card .value {
            color: #2563eb;
            font-size: 30px;
            font-weight: bold;
        }


        .score-card .unit {
            color: #888;
            font-size: 13px;
        }


        /* Exams */

        .exams-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }


        .exams-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }


        .exams-header h2 {
            color: #222;
            font-size: 22px;
        }


        .exam-count {
            background: #f1f3f5;
            color: #666;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }


        .exams {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }


        .exam {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            background: #f8f9fa;
        }


        .exam-title {
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            color: #333;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }


        .exam-image {
            padding: 15px;
            text-align: center;
        }


        .exam-image img {
            max-width: 100%;
            max-height: 700px;
            border-radius: 8px;
            display: block;
            margin: auto;
            object-fit: contain;
        }


        .no-image {
            padding: 40px 20px;
            color: #999;
            font-size: 14px;
        }


        .no-exams {
            text-align: center;
            padding: 50px 20px;
            color: #888;
            background: #f8f9fa;
            border-radius: 12px;
        }


        .no-exams-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }


        /* Back Button */

        .back-container {
            text-align: center;
        }


        .back-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }


        .back-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }


        /* Error */

        .error {
            background: white;
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }


        .error h2 {
            color: #dc2626;
            margin-bottom: 10px;
        }


        .error p {
            color: #777;
            margin-bottom: 25px;
        }


        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }


            .student-card,
            .exams-card {
                padding: 20px 15px;
            }


            .student-header {
                gap: 15px;
            }


            .student-avatar {
                width: 65px;
                height: 65px;
                font-size: 25px;
            }


            .student-name h2 {
                font-size: 19px;
            }


            .scores {
                grid-template-columns: 1fr;
            }


            .score-card .value {
                font-size: 26px;
            }


            .page-header h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="container">

        <!-- Page Header -->

        <div class="page-header">

            <h1>📋 تفاصيل الطالب</h1>

            <p>بيانات ونتائج الطالب</p>

        </div>


        <!-- Student Information -->

        <div id="studentContent">

            <!-- Generated by JavaScript -->

        </div>


        <!-- Back -->

        <div class="back-container">

            <button
                class="back-btn"
                onclick="goBack()">

                ← العودة إلى دوري المبرمجين

            </button>

        </div>

    </div>


    <!-- Student Data -->

    <script src="students.js"></script>


    <script>

        // ==========================================
        // GET STUDENT ID FROM URL
        // ==========================================

        const params = new URLSearchParams(window.location.search);

        const studentId = Number(params.get("id"));


        // ==========================================
        // FIND STUDENT
        // ==========================================

        const student = competitors.find(
            x => x.id === studentId
        );


        // ==========================================
        // CONTAINER
        // ==========================================

        const container =
            document.getElementById("studentContent");


        // ==========================================
        // INVALID STUDENT
        // ==========================================

        if (!student) {

            container.innerHTML = `

                <div class="error">

                    <h2>الطالب غير موجود</h2>

                    <p>
                        لم يتم العثور على بيانات الطالب المطلوبة.
                    </p>

                    <button
                        class="back-btn"
                        onclick="goBack()">

                        العودة إلى القائمة

                    </button>

                </div>

            `;

        }


        // ==========================================
        // DISPLAY STUDENT
        // ==========================================

        else {

            const avatarContent = student.avatar

                ? `<img src="${student.avatar}" alt="${student.name}">`

                : student.name.charAt(0).toUpperCase();


            // Exams

            let examsHtml = "";


            if (!student.exams || student.exams.length === 0) {

                examsHtml = `

                    <div class="no-exams">

                        <div class="no-exams-icon">
                            📝
                        </div>

                        <div>
                            لا توجد امتحانات مضافة لهذا الطالب حتى الآن.
                        </div>

                    </div>

                `;

            }

            else {

                examsHtml = student.exams.map(exam => {

                    const imageHtml = exam.img

                        ? `
                            <div class="exam-image">
                                <img
                                    src="${exam.img}"
                                    alt="${exam.title}">
                            </div>
                          `

                        : `
                            <div class="no-image">
                                لا توجد صورة لهذا الامتحان.
                            </div>
                          `;


                    return `

                        <div class="exam">

                            <div class="exam-title">
                                ${exam.title}
                            </div>

                            ${imageHtml}

                        </div>

                    `;

                }).join("");

            }


            container.innerHTML = `

                <!-- Student Card -->

                <div class="student-card">

                    <div class="student-header">

                        <div class="student-avatar">

                            ${avatarContent}

                        </div>


                        <div class="student-name">

                            <h2>
                                ${student.name}
                            </h2>

                            <p>
                                بيانات الطالب
                            </p>

                        </div>

                    </div>


                    <!-- Scores -->

                    <div class="scores">

                        <div class="score-card">

                            <div class="label">
                                نقاط هذا الشهر
                            </div>

                            <div class="value">
                                ${student.monthlyPoints}
                            </div>

                            <div class="unit">
                                نقطة
                            </div>

                        </div>


                        <div class="score-card">

                            <div class="label">
                                إجمالي النقاط
                            </div>

                            <div class="value">
                                ${student.overallPoints}
                            </div>

                            <div class="unit">
                                نقطة
                            </div>

                        </div>

                    </div>

                </div>


                <!-- Exams -->

                <div class="exams-card">

                    <div class="exams-header">

                        <h2>
                            📝 الامتحانات
                        </h2>

                        <div class="exam-count">
                            ${student.exams ? student.exams.length : 0}
                            امتحان
                        </div>

                    </div>


                    <div class="exams">

                        ${examsHtml}

                    </div>

                </div>

            `;

        }


        // ==========================================
        // BACK TO LEADERBOARD
        // ==========================================

        function goBack() {

            window.location.href = "index.html";

        }

    </script>

</body>

</html>
